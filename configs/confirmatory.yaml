model:
  batch_size: 16
  l2: 0.0001

partition:
  dirichlet_alpha: 0.3
  min_train_samples: 5

topology:
  n_domains: 4
  mixing_window: 4
  nominal_link_loss: 0.0
  outage_link_loss: 0.05
  degraded_link_loss: 0.60
  outage_start_fraction: 0.35
  outage_end_fraction: 0.65
  coverage_weight: 2.0
  domain_weight: 0.75
  reliability_weight: 0.25
  coverage_ema_rate: 0.2
  reliability_ema_rate: 0.1

pilot:
  seed: 4029430738
  rounds: 60
  eval_every: 10
  learning_rates: [0.003, 0.01, 0.03, 0.1, 0.3, 1.0, 3.0, 10.0, 30.0, 100.0]
  selection_metric: final_validation_loss
  fail_on_boundary: true
  grid_note: >-
    Validation-only pilot on the new split. A method receives one learning rate
    per dataset and partition, chosen by minimum final validation loss. The main
    test curves remain unread until every selection is locked away from both
    search-grid boundaries.

analysis:
  confidence_level: 0.95
  recovery_fraction_of_nominal_final: 0.95
  primary_dataset: digits
  primary_partition: noniid_domain
  primary_comparator: random_gossip_gt
  noninferiority_margin: 0.005
  primary_unit: three_dataset_macro_average_within_seed
  multiplicity_correction: holm_within_metric_across_decentralized_peers
