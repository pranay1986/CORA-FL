experiment:
  name: corafl_confirmatory_v1
  datasets: [digits, breast_cancer, wine]
  partitions: [iid, noniid, noniid_domain]
  scenarios: [nominal, one_domain]
  methods:
    - fedavg
    - ring_gt
    - random_gossip_gt
    - exponential_gt
    - matcha_gt
    - adaptive_similarity_gt
    - cora_fl
  n_clients: 8
  rounds: 100
  eval_every: 5
  split_seed: 4144280299
  main_seeds:
    - 1647281841
    - 3834135152
    - 4205234828
    - 3729392660
    - 117581348
