[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "cora-fl"
version = "0.1.0"
description = "Reproducible simulator for correlated-outage-resilient adaptive decentralized learning"
requires-python = ">=3.10"
dependencies = [
  "numpy==2.3.5",
  "pandas==2.2.3",
  "scikit-learn==1.8.0",
  "scipy==1.17.0",
  "matplotlib==3.10.8",
  "PyYAML==6.0.3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
